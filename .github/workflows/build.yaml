# DusRel CI: verify + build every app (web + Android APK).
#
# Runs on every push to main and on pull requests. Each app builds its
# web release and a debug APK; both are uploaded as artifacts.
# Release APKs are not built here yet — they need a signing keystore
# (see the note at the bottom).
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Shared checks: analyze + tests in every workspace package.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install Melos
        run: |
          dart pub global activate melos 8.10.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Bootstrap workspace
        run: melos bootstrap
      - name: Analyze
        run: melos run analyze
      - name: Test
        run: melos run test

  # Web release build for each app.
  build-web:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [notes, chat, calendar, drive]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install Melos
        run: |
          dart pub global activate melos 8.10.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Bootstrap workspace
        run: melos bootstrap
      - name: Build web (${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}
        run: flutter build web --release
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/web

  # Android debug APK for each app.
  build-apk:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [notes, chat, calendar, drive]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install NDK 28.2.13676358 (r28c, required by Flutter 3.47)
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - name: Install Melos
        run: |
          dart pub global activate melos 8.10.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Bootstrap workspace
        run: melos bootstrap
      - name: Build APK (${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk

# NOTE: release APKs (--release) need a signing keystore. To add it later:
# 1. Create a keystore and base64-encode it.
# 2. Add GitHub secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS,
#    ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD.
# 3. Add a signing-config step before `flutter build apk --release`.
