name: dusrel_flutter
publish_to: none
description: "DusRel Flutter monorepo (Pub Workspaces + Melos) - notes, chat, calendar, drive apps."
version: 0.0.1
environment:
  sdk: ^3.13.0

workspace:
  - apps/*
  - packages/*

dev_dependencies:
  melos: ^8.0.0

melos:
  scripts:
    analyze: melos exec -- flutter analyze
    test: melos exec -- flutter test
